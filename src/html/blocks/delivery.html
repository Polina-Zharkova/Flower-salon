<section class="delivery">
  <div class="delivery__title">
    <h3 class="delivery__name">Доставка</h3>
    <h2 class="delivery__delivery-section">Как мы работаем</h2>
  </div>

  <div class="delivery__timeline">
    <div class="delivery__step">
      <div class="delivery__circle">1</div>
      <div class="delivery__card-left">
        <img src="icon-bouquet.svg" alt="Букет" />
        <p>Собираем букет</p>
      </div>
    </div>

    <div class="delivery__step">
      <div class="delivery__circle">2</div>
      <div class="delivery__card-right">
        <img src="icon-cart.svg" alt="Корзина" />
        <p>Оформляем заказ</p>
      </div>
    </div>

    <div class="delivery__step">
      <div class="delivery__circle">3</div>
      <div class="delivery__card-left">
        <img src="icon-florist.svg" alt="Флорист" />
        <p>Получаете фото букета</p>
      </div>
    </div>

    <div class="delivery__step">
      <div class="delivery__circle">4</div>
      <div class="delivery__card-right">
        <img src="icon-delivery.svg" alt="Доставка" />
        <p>Курьер доставляет</p>
      </div>
    </div>
  </div>
</section>
